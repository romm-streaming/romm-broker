[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webstation-broker"
version = "0.7.0"
description = "Session broker and collaboration interface for the RomM webstation container"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pyfatx>=0.0.8",
]

[project.scripts]
webstation-broker = "webstation_broker.main:run"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["webstation_broker*"]

[tool.setuptools.package-data]
webstation_broker = ["**/*.json"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# D enforces Google-style docstrings, ANN enforces type hints on every
# signature; both feed the generated developer reference.
select = ["E", "F", "W", "I", "D", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

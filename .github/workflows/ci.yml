name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install . "ruff==0.16.1" pytest pytest-asyncio

      # Style, docstrings (google convention) and type hints, per pyproject.
      # The developer reference is generated from the docstrings, so a
      # missing or malformed one is a docs regression as much as a lint one.
      - name: Lint
        run: ruff check webstation_broker tests

      # Catches the failure mode that actually bites: a bad import or syntax
      # error only surfacing when s6 restarts the service in the container.
      - name: Build the app
        env:
          BROKER_DEV_MODE: "true"
        run: python -c "from webstation_broker.app import create_app; create_app()"

      - name: Test
        run: pytest -q
